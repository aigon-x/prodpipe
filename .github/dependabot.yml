# Dependabot — AIGON Production Platform

> **STATUS: FOUNDATION PLACEHOLDER** — konfiguracja w fazie genesis.

version: 2
updates:
  # Rust crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:17"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:23"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
