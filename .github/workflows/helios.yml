name: HELIOS — Final Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  helios:
    name: HELIOS final gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run HELIOS final gate (RELEASE profile)
        run: |
          chmod +x tools/verify/verify.sh
          bash tools/verify/verify.sh gates RELEASE
