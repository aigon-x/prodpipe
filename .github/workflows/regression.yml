name: Regression

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  regression:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression gates (PRE_PUSH profile)
        run: |
          chmod +x tools/verify/verify.sh
          bash tools/verify/verify.sh gates PRE_PUSH
