name: Feature

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  feature:
    name: Feature validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce branch prefix
        run: |
          BRANCH="${GITHUB_HEAD_REF}"
          case "$BRANCH" in
            feature/*|fix/*|migration/*|security/*|release/*) ;;
            *) echo "FAIL: gałąź '$BRANCH' nie ma dozwolonego prefiksu (feature/fix/migration/security/release)"; exit 1 ;;
          esac
      - name: Run quality gates (PRE_PUSH profile)
        run: |
          chmod +x tools/verify/verify.sh
          bash tools/verify/verify.sh gates PRE_PUSH
