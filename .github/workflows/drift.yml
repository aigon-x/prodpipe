name: Drift

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # codziennie 03:17 UTC

jobs:
  drift:
    name: Drift detection (Git desired vs Runtime actual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run drift reconciliation
        run: |
          chmod +x tools/verify/verify.sh
          bash tools/verify/verify.sh drift
