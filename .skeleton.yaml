# ============================================================================
# .skeleton.yaml — AIGON Production Platform — OBS-BASELINE manifest
# ============================================================================
# Manifest szkieletu projektu. Definiuje cechy projektu, które decydują o tym,
# które moduły verify są WARUNKOWE (wykonywane tylko gdy cecha jest włączona).
#
# OBS-BASELINE: szablon rodzi obserwowalne projekty. Moduły warunkowe
# (obs-health-endpoints, synthetics) czytają flagi z tego manifestu:
#   * web: true   — projekt eksponuje HTTP (healthz/readyz, syntetyki)
#   * events: true — projekt emituje zdarzenia (tracing, korelacja)
#   * tier: 1..3  — klasa krytyczności (SLO floor, dashboardy obowiązkowe)
#
# ZASADA TEMPLATE: świeży projekt (zero kodu domenowego) ma web: false,
# events: false, tier: 3. Detektory warunkowe robią wtedy skip + evidence N/A.
# Placeholdery endpointów NIGDY nie są realnymi URL-ami (self-scan).
#
# Scaffold substytuuje te wartości przy tworzeniu nowego projektu.
# ============================================================================

# ── Cechy projektu ──────────────────────────────────────────────────────────
web: false          # true = projekt eksponuje HTTP (healthz/readyz, syntetyki)
events: false       # true = projekt emituje zdarzenia (tracing, korelacja)
tier: 3             # 1..3 — klasa krytyczności (1 = najwyższa)

# ── Identyfikacja ───────────────────────────────────────────────────────────
service_id: "template"   # identyfikator serwisu (substytuowany przez scaffold)
