# ── Słowa-slogany ──────────────────────────────────────────────────────────
# Słowa, które wyglądają jak precyzyjne wymagania, ale często nie mają
# formalnej definicji. Gate sprawdza, czy każde z nich ma formalną definicję
# (nie jest gołe). Jeżeli nie → UNKNOWN_SEMANTICS.
slogan_terms:
  - "production ready"
  - "secure"
  - "trusted"
  - "safe"
  - "autonomous"
  - "critical"
  - "high risk"
  - "verified"
  - "canonical"
  - "resilient"
  - "sovereign"
