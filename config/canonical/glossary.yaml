# ============================================================================
# glossary.yaml — ŹRÓDŁO PRAWDY dla ARCHITECTURAL SEMANTICS GATE.
# ============================================================================
# Rejestr terminów używanych przez system. Każdy termin krytyczny MUSI mieć:
#   - canonical_definition (definicja kanoniczna)
#   - source (skąd pochodzi)
#   - owner (właściciel)
#   - version (wersja)
#   - epistemic_status (FACT | INFERENCE | HYPOTHESIS | UNKNOWN)
#
# Zasada epistemic governance: FACT / INFERENCE / HYPOTHESIS / UNKNOWN
# nie mogą się mieszać. Termin bez epistemic_status = UNKNOWN_SEMANTICS.
#
# Termin krytyczny z epistemic_status=UNKNOWN → GATE = FAIL (BLOCKING).
# Termin niekrytyczny bez definicji → WARN.
#
# NIE edytuj tego pliku ręcznie bez przejścia przez ARCHITECTURAL SEMANTICS
# GATE (SEM-001..007). Zmiany glossary = tylko platform (CODEOWNERS).
# ============================================================================

schema_version: 1

