# ============================================================================
# credentials.yaml — Credential Registry (SEC-CR-01..04)
# ============================================================================
# Rejestr poświadczeń (credential registry). ŹRÓDŁO PRAWDY dla modułu
# tools/verify/security/sec-credential-registry.sh.
#
# ZASADA TEMPLATE: ten plik zawiera WYŁĄCZNIE placeholdery — NIGDY prawdziwych
# sekretów. Prawdziwe wartości żyją w Vault / secret manager, NIE w repo.
# Każdy wpis MUSI mieć: name, owner, environment, rotation_date, status.
#
# Statusy: active | rotating | revoked
#   active    — poświadczenie aktywne, w oknie rotacji
#   rotating  — w trakcie rotacji (data_rotacji w przeszłości, wymaga rotacji)
#   revoked   — unieważnione, nieużywane
#
# rotation_date: data, do której poświadczenie MUSI zostać zrotowane (ISO-8601).
# SEC-ROT-01: rotation_date musi być w przyszłości lub w dozwolonym oknie.
# SEC-ROT-02: przeterminowane poświadczenia muszą mieć status "rotating".
# ============================================================================

schema_version: 1

# ── Rejestr poświadczeń ─────────────────────────────────────────────────────
# Każdy wpis: name, owner, environment, rotation_date, status.
# Placeholdery — wartości referencyjne, nie sekrety.
credentials:
  - name: db-primary-app
    owner: "@platform-db"
    environment: production
    rotation_date: "2026-12-01"
    status: active
    reference: "vault:secret/db/primary-app"
  - name: db-primary-app-staging
    owner: "@platform-db"
    environment: staging
    rotation_date: "2026-11-15"
    status: active
    reference: "vault:secret/db/primary-app-staging"
  - name: api-gateway-token
    owner: "@platform-net"
    environment: production
    rotation_date: "2026-10-20"
    status: active
    reference: "vault:secret/gateway/token"
  - name: object-storage-key
    owner: "@platform-storage"
    environment: production
    rotation_date: "2026-09-30"
    status: active
    reference: "vault:secret/storage/key"
  - name: legacy-worker-credential
    owner: "@platform-app"
    environment: production
    rotation_date: "2026-07-01"
    status: rotating
    reference: "vault:secret/legacy/worker"
  - name: decommissioned-service-key
    owner: "@platform-app"
    environment: production
    rotation_date: "2026-01-15"
    status: revoked
    reference: "vault:secret/decommissioned/key"
