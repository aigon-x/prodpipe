# ============================================================================
# pipelines.yaml — Pipeline Operating System (metadata-driven). ŹRÓDŁO PRAWDY.
# ============================================================================
# Ten plik jest jedynym miejscem, w którym definiuje się pipeline'y:
#   - identyfikator (id) — P-<seq>
#   - rodzina (family) — PRODUCT/DESIGN/SECURITY/CODE/BUILD/DEPLOYMENT/RUNTIME/RECOVERY
#   - ścieżka skryptu (script) — względem tools/automation/
#   - klasa wykonania (class) — FAST | STANDARD | DEEP | RELEASE | CONTINUOUS
#   - status — IMPLEMENTED | PROPOSED
#   - zależności (depends) — pipeline'y, które muszą przejść PRZED tym
#   - kontrakt (contract) — 8 faz wspólnego Pipeline Contract
#
# pipelines.sh jest GENEROWANY z tego pliku przez tools/automation/core/gen-pipelines.sh.
# NIE edytuj pipelines.sh ręcznie — edytuj ten plik i uruchom generator.
#
# Wspólny Pipeline Contract (każdy pipeline):
#   DISCOVER → CONTRACT → EXECUTE → TEST → EVIDENCE → VERIFY → REGISTER → REPORT
#
# Klasy wykonania:
#   FAST       — <10s, pre-commit, oczywiste błędy
#   STANDARD   — <1-3min, pre-push, pełna certyfikacja lokalna
#   DEEP       — minuty, CI, niezależna weryfikacja
#   RELEASE    — pełna certyfikacja baseline/release
#   CONTINUOUS — ciągłe monitorowanie / asynchroniczne
#
# Mapowanie na StateStore:
#   - P-003/P-043/P-044 konsumują migrację 0017 (lifecycle plane: requirement/change/verification/release)
#   - P-014/P-045/P-046 konsumują migrację 0011 (change intelligence: change_proposals/prediction_accuracy/change_scope/duplicate_work)
#   - Każdy pipeline zapisuje evidence przez evidence_record() (P0#1)
# ============================================================================

schema_version: 1

# ── Rodziny pipeline'ów ─────────────────────────────────────────────────────
families:
  PRODUCT:     "Produkt i odkrywanie (Product & Discovery)"
  DESIGN:      "Projekt i architektura (Design & Architecture)"
  SECURITY:    "Bezpieczeństwo (Security)"
  CODE:        "Kod i jakość (Code & Quality)"
  BUILD:       "Budowa i release (Build & Release)"
  DEPLOYMENT:  "Wdrożenie (Deployment)"
  RUNTIME:     "Runtime i operacje (Runtime & Operations)"
  RECOVERY:    "Odzysk i governance (Recovery & Governance)"
  GTM:         "Go-To-Market (rynek jako przedłużenie architektury)"
  AI:          "Sztuczna inteligencja (AI Plane — ML/DL/LLM lifecycle)"
  OFFENSIVE-SECURITY: "Offensive Security Plane (Red/Blue/Purple Team)"
  HUMAN-SIMULATION: "Human Simulation Plane (test to nie skrypt, to użytkownik)"
  SIMULATION: "Simulation Plane (symulacje katastrof — 'śmierć foundera' to test, nie tragedia)"

# ── MONITOR PLANE ───────────────────────────────────────────────────────────
# Pipeline to NIE skrypt, który się uruchamia — to PROCES, który ma stan,
# lifecycle, i może być kontrolowany. Monitor Plane definiuje:
#   * 9 etapów lifecycle (REGISTER → ARCHIVE)
#   * typy harmonogramowania (schedule)
#   * akcje kontrolne (control)
#   * elementy monitorowania (monitor)
#   * kanały powiadomień (notify)
#   * metrykę zdrowia MON_health
#   * gate'y MON-* (MON-R-01..06, MON-S-01..08, MON-Q-01..08, MON-ST-01..08,
#     MON-M-01..08, MON-C-01..08, MON-CO-01..08, MON-N-01..08, MON-A-01..08)
#
# Każdy pipeline w sekcji `pipelines:` może mieć pola MON-*:
#   schedule       — typ harmonogramowania (cron|interval|event|conditional|manual|reminder|escalation)
#   schedule_spec  — specyfikacja (cron expr / sekundy / nazwa eventu / warunek)
#   control        — dozwolone akcje kontrolne (pause|resume|cancel|retry|skip|restart)
#   monitor        — elementy monitorowania (status|progress|logs|metrics|dashboard|timeline)
#   notify         — kanały powiadomień (email|slack|dashboard|webhook)
#   timeout        — limit czasu wykonania (sekundy)
#   retries        — maksymalna liczba ponowień
#   priority       — LOW | NORMAL | HIGH | CRITICAL
#
# Domyślne wartości (gdy pole pominięte):
#   schedule: manual, schedule_spec: "", control: [pause,resume,cancel,retry,skip,restart],
#   monitor: [status,progress,logs,metrics,dashboard,timeline], notify: [dashboard],
#   timeout: 300, retries: 3, priority: NORMAL
# ────────────────────────────────────────────────────────────────────────────
monitor_plane:
  schema_version: 1
  # ── 9 etapów lifecycle ────────────────────────────────────────────────────
  stages:
    REGISTER:  "Rejestracja pipeline'a w Monitor Plane (stan PENDING)"
    SCHEDULE:  "Harmonogramowanie (cron/interval/event/conditional/manual/reminder/escalation)"
    QUEUE:     "Kolejkowanie (oczekiwanie na zasoby/zależności)"
    START:     "Start wykonania (stan RUNNING)"
    MONITOR:   "Monitorowanie (status/progress/logs/metrics/dashboard/timeline)"
    CONTROL:   "Kontrola (pause/resume/cancel/retry/skip/restart)"
    COMPLETE:  "Zakończenie (stan COMPLETED/FAILED)"
    NOTIFY:    "Powiadomienie (email/slack/dashboard/webhook)"
    ARCHIVE:   "Archiwizacja (evidence + historia)"
  # ── Stany maszyny stanów ─────────────────────────────────────────────────
  states:
    PENDING:   "zarejestrowany, czeka na harmonogram"
    SCHEDULED: "zaplanowany, czeka na kolejkę"
    QUEUED:    "w kolejce, czeka na start"
    RUNNING:   "wykonywany"
    PAUSED:    "wstrzymany (control: pause)"
    COMPLETED: "zakończony sukcesem"
    FAILED:    "zakończony porażką"
    CANCELLED: "anulowany (control: cancel)"
    SKIPPED:   "pominięty (control: skip)"
    ARCHIVED:  "zarchiwizowany"
  # ── Typy harmonogramowania ───────────────────────────────────────────────
  schedule_types:
    cron:       "wyrażenie cron (np. '0 3 * * *')"
    interval:   "co N sekund/minut"
    event:      "wyzwalany eventem (np. git push, file change)"
    conditional: "gdy warunek spełniony (np. zależność PASS)"
    manual:     "tylko ręcznie"
    reminder:   "przypomnienie o wykonaniu"
    escalation: "eskalacja po porażce/limicie czasu"
  # ── Akcje kontrolne ──────────────────────────────────────────────────────
  control_actions:
    pause:   "wstrzymaj wykonanie (RUNNING → PAUSED)"
    resume:  "wznów wykonanie (PAUSED → RUNNING)"
    cancel:  "anuluj (RUNNING/PAUSED → CANCELLED)"
    retry:   "ponów (FAILED → QUEUED)"
    skip:    "pomiń (PENDING/SCHEDULED → SKIPPED)"
    restart: "restartuj (COMPLETED/FAILED → QUEUED)"
  # ── Elementy monitorowania ───────────────────────────────────────────────
  monitor_elements:
    status:    "bieżący stan pipeline'a"
    progress:  "postęp wykonania (%)"
    logs:      "logi wykonania"
    metrics:   "metryki (czas, pamięć, sukces)"
    dashboard: "widok zbiorczy"
    timeline:  "oś czasu lifecycle"
  # ── Kanały powiadomień ───────────────────────────────────────────────────
  notify_channels:
    email:     "e-mail"
    slack:     "Slack webhook"
    dashboard: "dashboard (wbudowany)"
    webhook:   "zewnętrzny webhook"
  # ── Metryka zdrowia ──────────────────────────────────────────────────────
  # MON_health = pipeline_success_rate × pipeline_coverage × control_rate × notification_rate
  # Każdy czynnik w [0,1]. MON_health w [0,1]. 1.0 = pełne zdrowie.
  health_metric:
    formula: "MON_health = pipeline_success_rate × pipeline_coverage × control_rate × notification_rate"
    pipeline_success_rate: "udane wykonania / wszystkie wykonania"
    pipeline_coverage:     "pipeline'y z evidence / wszystkie pipeline'y"
    control_rate:          "skuteczne akcje kontrolne / wszystkie akcje kontrolne"
    notification_rate:     "wysłane powiadomienia / wymagane powiadomienia"
  # ── Gate'y MON-* ─────────────────────────────────────────────────────────
  # 9 grup × 8 gate'ów (MON-R ma 6). Łącznie 70 gate'ów.
  gates:
    MON-R:  # REGISTER (6)
      MON-R-01: "pipeline zarejestrowany w Monitor Plane"
      MON-R-02: "stan początkowy PENDING"
      MON-R-03: "unikalny identyfikator pipeline'a"
      MON-R-04: "metadane MON-* kompletne (schedule/control/monitor/notify)"
      MON-R-05: "timeout i retries dodatnie"
      MON-R-06: "priority w {LOW,NORMAL,HIGH,CRITICAL}"
    MON-S:  # SCHEDULE (8)
      MON-S-01: "typ harmonogramowania poprawny"
      MON-S-02: "specyfikacja harmonogramu poprawna (cron/interval/event/conditional)"
      MON-S-03: "harmonogram nie koliduje z zależnościami"
      MON-S-04: "pipeline zaplanowany (stan SCHEDULED)"
      MON-S-05: "okno czasowe respektowane"
      MON-S-06: "eskalacja skonfigurowana dla harmonogramu"
      MON-S-07: "reminder skonfigurowany (jeśli typ=reminder)"
      MON-S-08: "harmonogram zapisany w StateStore"
    MON-Q:  # QUEUE (8)
      MON-Q-01: "pipeline w kolejce (stan QUEUED)"
      MON-Q-02: "zależności spełnione przed startem"
      MON-Q-03: "kolejka FIFO respektowana"
      MON-Q-04: "limit współbieżności respektowany"
      MON-Q-05: "priorytet respektowany w kolejce"
      MON-Q-06: "timeout kolejki nie przekroczony"
      MON-Q-07: "kolejka zapisana w StateStore"
      MON-Q-08: "brak deadlocku zależności"
    MON-ST: # START (8)
      MON-ST-01: "pipeline wystartował (stan RUNNING)"
      MON-ST-02: "skrypt istnieje i jest wykonywalny"
      MON-ST-03: "środowisko przygotowane"
      MON-ST-04: "timestamp startu zapisany"
      MON-ST-05: "PID procesu zapisany"
      MON-ST-06: "timeout uruchomiony"
      MON-ST-07: "logi otwarte"
      MON-ST-08: "start zapisany w StateStore"
    MON-M:  # MONITOR (8)
      MON-M-01: "status monitorowany"
      MON-M-02: "postęp raportowany"
      MON-M-03: "logi zbierane"
      MON-M-04: "metryki zbierane"
      MON-M-05: "dashboard aktualizowany"
      MON-M-06: "timeline aktualizowany"
      MON-M-07: "monitoring zapisany w StateStore"
      MON-M-08: "brak fałszywego zielonego (NO FALSE GREEN)"
    MON-C:  # CONTROL (8)
      MON-C-01: "akcje kontrolne dozwolone (z metadanych)"
      MON-C-02: "pause działa (RUNNING → PAUSED)"
      MON-C-03: "resume działa (PAUSED → RUNNING)"
      MON-C-04: "cancel działa (→ CANCELLED)"
      MON-C-05: "retry działa (FAILED → QUEUED)"
      MON-C-06: "skip działa (→ SKIPPED)"
      MON-C-07: "restart działa (→ QUEUED)"
      MON-C-08: "kontrola zapisana w StateStore"
    MON-CO: # COMPLETE (8)
      MON-CO-01: "pipeline zakończony (COMPLETED/FAILED)"
      MON-CO-02: "exit code przechwycony"
      MON-CO-03: "status końcowy poprawny"
      MON-CO-04: "timestamp końca zapisany"
      MON-CO-05: "czas trwania policzony"
      MON-CO-06: "wynik zapisany w StateStore"
      MON-CO-07: "zależności downstream powiadomione"
      MON-CO-08: "brak fałszywego zielonego (FAIL-CLOSED)"
    MON-N:  # NOTIFY (8)
      MON-N-01: "kanały powiadomień skonfigurowane"
      MON-N-02: "powiadomienie o sukcesie wysłane"
      MON-N-03: "powiadomienie o porażce wysłane"
      MON-N-04: "powiadomienie o eskalacji wysłane"
      MON-N-05: "powiadomienie o reminderze wysłane"
      MON-N-06: "powiadomienie zapisane w StateStore"
      MON-N-07: "brak duplikatów powiadomień"
      MON-N-08: "notification_rate policzony"
    MON-A:  # ARCHIVE (8)
      MON-A-01: "pipeline zarchiwizowany (stan ARCHIVED)"
      MON-A-02: "evidence zapisane"
      MON-A-03: "logi zarchiwizowane"
      MON-A-04: "metryki zarchiwizowane"
      MON-A-05: "historia lifecycle zapisana"
      MON-A-06: "archiwum zapisane w StateStore"
      MON-A-07: "brak wycieku zasobów"
      MON-A-08: "MON_health zaktualizowany"

