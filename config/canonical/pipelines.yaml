# ============================================================================
# pipelines.yaml — Pipeline Operating System (metadata-driven). ŹRÓDŁO PRAWDY.
# ============================================================================
# Ten plik jest jedynym miejscem, w którym definiuje się pipeline'y:
#   - identyfikator (id) — P-<seq>
#   - rodzina (family) — PRODUCT/DESIGN/SECURITY/CODE/BUILD/DEPLOYMENT/RUNTIME/RECOVERY
#   - ścieżka skryptu (script) — względem tools/automation/
#   - klasa wykonania (class) — FAST | STANDARD | DEEP | RELEASE | CONTINUOUS
#   - status — IMPLEMENTED | PROPOSED
#   - zależności (depends) — pipeline'y, które muszą przejść PRZED tym
#   - kontrakt (contract) — 8 faz wspólnego Pipeline Contract
#
# pipelines.sh jest GENEROWANY z tego pliku przez tools/automation/core/gen-pipelines.sh.
# NIE edytuj pipelines.sh ręcznie — edytuj ten plik i uruchom generator.
#
# Wspólny Pipeline Contract (każdy pipeline):
#   DISCOVER → CONTRACT → EXECUTE → TEST → EVIDENCE → VERIFY → REGISTER → REPORT
#
# Klasy wykonania:
#   FAST       — <10s, pre-commit, oczywiste błędy
#   STANDARD   — <1-3min, pre-push, pełna certyfikacja lokalna
#   DEEP       — minuty, CI, niezależna weryfikacja
#   RELEASE    — pełna certyfikacja baseline/release
#   CONTINUOUS — ciągłe monitorowanie / asynchroniczne
#
# Mapowanie na StateStore:
#   - P-003/P-043/P-044 konsumują migrację 0017 (lifecycle plane: requirement/change/verification/release)
#   - P-014/P-045/P-046 konsumują migrację 0011 (change intelligence: change_proposals/prediction_accuracy/change_scope/duplicate_work)
#   - Każdy pipeline zapisuje evidence przez evidence_record() (P0#1)
# ============================================================================

schema_version: 1

# ── Rodziny pipeline'ów ─────────────────────────────────────────────────────
families:
  PRODUCT:     "Produkt i odkrywanie (Product & Discovery)"
  DESIGN:      "Projekt i architektura (Design & Architecture)"
